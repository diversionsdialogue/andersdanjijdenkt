# =============================================================================
# nginx-configuratie andersdanjijdenkt.nl (Ploi -> Site -> Manage -> Edit NGINX
# configuration). Dit bestand is de bron van waarheid; wijzig hier en plak het
# daarna in zijn geheel in Ploi.
#
# VOOR GEBRUIK
#   1. Vergelijk met wat Ploi na het aanmaken van de site genereert: de regels
#      "include /etc/nginx/ploi/..." en "include /etc/nginx/ssl/..." en het
#      pad van de root moeten exact overeenkomen met die versie. Voeg eventueel
#      testdomeinnaam (.ploi.link) toe aan de domeinregel. Gebruik hiervoor de
#      skill ploi-nginx-astro.
#   2. Vervang [geheim] door het webhook-secret uit de wachtwoordmanager
#      (openssl rand -hex 32). Dezelfde waarde staat in n8n in de Header Auth-
#      credential van de workflow "andersdanjijdenkt contact". Het secret
#      hoort NOOIT in deze repo.
#   3. Na plakken: nginx -t, dan reload.
#
# LET OP: schrijf in de commentaarkop NOOIT de naam van de domeinregel uit.
# Ploi vervangt bij domeinwijzigingen de eerste regel die dat woord bevat,
# en dat brak de config (regel buiten het serverblok).
#
# Site: statische export van WordPress (Simply Static). Geen PHP nodig.
# =============================================================================

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/andersdanjijdenkt.nl/before/*;
limit_req_zone $binary_remote_addr zone=formulier_adjd:10m rate=5r/m;

server {
    #listen 80;
    #listen [::]:80;

    root /home/ploi/andersdanjijdenkt.nl;
    server_name andersdanjijdenkt.nl www.andersdanjijdenkt.nl quaint-sierra-jacpnd11zg.ploi.link;

    include /etc/nginx/ssl/andersdanjijdenkt.nl;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    error_page 404 /404.html;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/andersdanjijdenkt.nl/server/*;

    # =========================================================================
    # 301-redirects: WordPress-pagina's die in de statische versie niet meer
    # bestaan. Moeten vóór "location /" staan.
    # =========================================================================
    location ^~ /2025/ { return 301 /; }
    location ^~ /author/ { return 301 /over-ons/; }
    location ^~ /category/ { return 301 /; }
    location ~ ^/(post|category|post_tag|attachment)-sitemap\.xml$ { return 301 /sitemap.xml; }
    location = /sitemap.rss { return 301 /sitemap.xml; }

    # Interne repo-bestanden niet publiek serveren (deploy-config, workflow-JSON,
    # handleiding). Geven een 404 met de eigen 404-pagina.
    location ~ ^/(deploy/|DEPLOY\.md|\.gitignore) { return 404; }

    # =========================================================================
    # Contactformulier -> n8n (nginx voegt het secret toe, de browser kent het niet)
    # =========================================================================
    location = /api/formulier {
        limit_except POST { deny all; }
        limit_req zone=formulier_adjd burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        proxy_pass https://diversions-connect-u67534.vm.elestio.app/webhook/formulier-andersdanjijdenkt;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host diversions-connect-u67534.vm.elestio.app;
        proxy_set_header X-Webhook-Secret "[geheim]";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # =========================================================================
    # Cache voor statische assets. CSS/JS uit WordPress dragen ?ver=-parameters,
    # beelden niet; daarom 30 dagen en geen "immutable".
    # LET OP: nginx erft add_header niet over zodra een location er zelf een
    # heeft; de beveiligingsheaders staan daarom in elk blok herhaald.
    # =========================================================================
    location ^~ /wp-content/ {
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /wp-includes/ {
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=2592000";
    }

    # =========================================================================
    # Statische serving. Onbekende URL's geven een echte 404 (geen soft-404).
    # =========================================================================
    location / {
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache";

        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
